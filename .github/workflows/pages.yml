# The demo on GitHub Pages, rebuilt when it or what it shows changes.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "src/**"
      - "fixtures/**"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

# One deploy at a time, and a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the demo
    # GitHub Free serves Pages from public repos only, so a private repo skips it, at no cost.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - run: vp run demo:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-demo

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write # publish the site
      id-token: write # prove to Pages that this workflow built it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
