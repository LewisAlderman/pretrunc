# Releases with uppt (github.com/danielroe/uppt): every push to main updates a draft
# release pull request whose version and changelog come from the Conventional Commits
# since the last tag. Merging it tags the commit, makes the GitHub release, and
# dispatches this workflow on the tag, which packs the package in one job and stages
# the tarball on npm from another, the only job that can reach npm. npm trusts this
# workflow through trusted publishing and lets it only stage: a maintainer approves each
# release with 2FA on npmjs.com before it goes live.
name: Release

on:
  push:
    # release/v* picks up hand edits to an open release pull request.
    branches: [main, "release/v*"]
  pull_request:
    types: [closed]
    branches: [main]
  # Merged release pull requests, reruns of a publish, and prereleases arrive here.
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Cut a prerelease instead of a normal release, e.g. `beta`, `rc` or `0`"
        required: false
        default: ""
      npm-tag:
        description: "The npm dist-tag to publish to. uppt sets it for maintenance lines; leave it blank"
        required: false
        default: ""

# One run per ref at a time, never cancelled: a release half done stays whole.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  VP_GIT_HOOKS: "0"

jobs:
  pr:
    name: Update the release pull request
    if: |
      !github.event.repository.fork
      && (
        (
          github.event_name == 'push'
          && (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
            || startsWith(github.ref, 'refs/heads/release/v')
          )
        ) || (
          github.event_name == 'workflow_dispatch'
          && !startsWith(github.ref, 'refs/tags/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A newer push to the same branch makes the update in progress moot.
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write # the release/vX.Y.Z branch with the version bump
      pull-requests: write # the draft release pull request
    steps:
      - uses: danielroe/uppt/pr@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.prerelease }}

  release:
    name: Tag and release
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # the tag and GitHub release
      actions: write # dispatching this workflow on the new tag
    steps:
      - uses: danielroe/uppt/release@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # On the vX.Y.Z tag: the tarball, built by `prepack`, with no way to publish it.
  pack:
    name: Pack
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read # the tagged source
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned Node and pnpm, which uppt's own install wouldn't use. Dependencies'
      # install scripts don't run, as in uppt's install, and no cache is read: one a
      # branch could write would reach a release.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - id: pack
        uses: danielroe/uppt/pack@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          checkout: false
          install: false

  # Stages the packed tarball on npm, running none of the package's scripts.
  publish:
    name: Stage on npm
    if: |
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.pack.outputs.files != '[]'
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write # npm trusted publishing and provenance
    # An environment, so staging can be held for approval in the repo's settings too.
    environment: npm
    steps:
      - uses: danielroe/uppt/publish@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          files: ${{ needs.pack.outputs.files }}
          npm-tag: ${{ inputs.npm-tag }}
