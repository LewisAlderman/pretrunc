# Versions and stages releases with Changesets. While changesets wait on main, a
# "Version Packages" pull request carries the next version and its changelog; merging it
# packs the package in one job and stages the tarball on npm from another, the only job
# that can reach npm. npm trusts this workflow through trusted publishing, so no token is
# stored, and it may only stage: a maintainer approves each release with 2FA, and
# tag.yml tags it once it's live.
name: Release

on:
  push:
    branches: [main]
    # A changeset added, or consumed by merging the version pull request.
    paths: [".changeset/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  VP_GIT_HOOKS: "0"

jobs:
  # "version" while changesets wait, "publish" once the version pull request is merged.
  select:
    name: Version or publish
    # Nothing to publish from a private repo, and no minutes spent finding that out.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      plan: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in this workflow: one a branch could write would reach a release.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      - id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Open the version pull request
    needs: select
    if: ${{ needs.select.outputs.mode == 'version' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the version branch's commit
      pull-requests: write # the version pull request
    steps:
      # The action commits through the GitHub API, signed, so git keeps no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp exec changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  # Builds the package (`prepack`) into a tarball, with no way to publish it.
  pack:
    name: Pack
    needs: select
    if: ${{ needs.select.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tarballs: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select.outputs.plan }}

  # Submits the packed tarball to npm's staging, which runs none of the package's
  # scripts and needs no checkout. npm holds it until a maintainer approves it with 2FA,
  # on npmjs.com or with `npm stage approve`; the trusted publisher may stage and do
  # nothing else. The tag and GitHub release follow once it's live (tag.yml).
  publish:
    name: Stage on npm
    needs: [select, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # An environment, so staging can be held for approval in the repo's settings too.
    environment: npm
    permissions:
      id-token: write # npm trusted publishing and provenance
    steps:
      # npm 11.15 or later stages; Node 26.12 ships 11.20.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.tarballs }}
          path: ${{ runner.temp }}/pack
      - name: Stage each tarball
        working-directory: ${{ runner.temp }}/pack
        run: |
          for tarball in $(find . -name '*.tgz'); do
            npm stage publish "$tarball" --access public
            echo "Staged \`$tarball\`: approve it on npmjs.com, in the package's Staged Packages tab, or with \`npm stage approve <stage-id>\`." >> "$GITHUB_STEP_SUMMARY"
          done
