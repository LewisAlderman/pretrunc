# Checks, tests in Node and all three engines, and the build, on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs vp, the pinned Node and pnpm, then `vp install`.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
      # The Effect lint rules `vp check` needs; `vp run setup` also installs Git hooks.
      - run: vp exec effect-tsgo patch --oxlint
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: vp check
      - run: vp run test
      - run: vp run build
