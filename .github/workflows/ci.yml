# Checks, tests in Node, Chromium and Firefox, and the build, on every push and pull
# request that touches more than docs or the demo. WebKit runs on macOS only
# (vite.config.ts), and the pre-commit hook type-checks the demo.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "demo/**"]
  pull_request:
    paths-ignore: ["**/*.md", "demo/**"]

# A newer push to the same branch makes the run in progress moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs vp, the pinned Node and pnpm, then `vp install`.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
      # The Effect lint rules `vp check` needs; `vp run setup` also installs Git hooks.
      - run: vp exec effect-tsgo patch --oxlint
      - run: vp exec playwright install --with-deps chromium firefox
      - run: vp check
      # Unused files, exports and dependencies (knip.jsonc).
      - run: vp exec knip
      - run: vp run test
      - run: vp run build
